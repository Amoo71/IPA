name: Build IPA

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build unsigned archive
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project Islander.xcodeproj \
            -scheme Islander \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Islander.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP="build/Islander.xcarchive/Products/Applications/Islander.app"
          if [ ! -d "$APP" ]; then echo "App not found at $APP"; ls -R build/Islander.xcarchive/Products || true; exit 1; fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry Islander-unsigned.ipa Payload)
          echo "Built:"; ls -lh build/Islander-unsigned.ipa
          echo "Embedded extensions:"; ls "$APP/PlugIns" || echo "(none)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Islander-ipa
          path: app/build/Islander-unsigned.ipa
          if-no-files-found: error
